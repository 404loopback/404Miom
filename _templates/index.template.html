<!DOCTYPE html>
<html lang="$lang$">
<head>
    ${head.partial.html()}
    <title>$if(index_title)$$index_title$$endif$</title>
</head>
<body>
    <main class="index">
        <div class="hero">
            <nav class="hero-nav">
                <a href="index.html"><img class="logo" src="assets/logo.svg" alt="404Cookbook"></a>
            </nav>
            $if(index_title)$
                <h1>$index_title$</h1>
            $endif$
            $if(index_description)$
                <p class="hero-desc">$index_description$</p>
            $endif$
            <div class="search">
                <input type="text" placeholder="$strings.search_placeholder$" id="search_input" disabled>
                <div class="results" id="search_output"></div>
                <script src="assets/search.js"></script>
            </div>
        </div>
        <div id="filter-pills" class="filter-pills"></div>
        ${for(categories)}
            <section data-category="${it.category}">
                <h2><a href="${it.category_faux_urlencoded}.html">${it.category}</a></h2>
                <div class="recipes-grid">
                    ${for(it.recipes)}
                        ${it:recipe_list_item.partial.html()}
                    ${endfor}
                </div>
            </section>
        ${endfor}
        ${footer.partial.html()}
        <script src="assets/filter.js"></script>
    </main>
</body>
</html>
